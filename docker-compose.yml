services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
        - type: bind
          source: .
          target: /app
          bind:
            create_host_path: false
        - type: volume
          source: node_modules
          target: /app/node_modules
        # `SLIDES_DIR=/path/to/slides docker compose up` or set in .env
        - type: bind
          source: ${SLIDES_DIR:-.}
          target: /slides
          bind:
            create_host_path: false
    command:
      - node
      - --experimental-strip-types
      - server.ts
      - --port
      - "3000"
      - --base-dir
      - /slides

volumes:
  node_modules:
